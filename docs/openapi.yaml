openapi: 3.1.0
info:
  title: MiraiLink Backend API
  version: 2.0.0
  description: Contrato vigente de las 43 operaciones REST de MiraiLink.
servers:
  - url: http://localhost:3000
tags:
  - name: App
  - name: Auth
  - name: Users
  - name: Photos
  - name: Discovery
  - name: Matches
  - name: Chats
  - name: Catalog
  - name: Moderation

paths:
  /api/app/version/android:
    get:
      tags: [App]
      operationId: getAndroidVersionPolicy
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      requestBody: { $ref: '#/components/requestBodies/Register' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      requestBody: { $ref: '#/components/requestBodies/Login' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/autologin:
    post:
      tags: [Auth]
      operationId: autoLogin
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/password/request-reset:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      requestBody: { $ref: '#/components/requestBodies/Email' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/password/confirm-reset:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      requestBody: { $ref: '#/components/requestBodies/PasswordReset' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/verification/request:
    post:
      tags: [Auth]
      operationId: requestVerification
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/VerificationType' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/verification/confirm:
    post:
      tags: [Auth]
      operationId: confirmVerification
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/VerificationCode' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/verification/check:
    get:
      tags: [Auth]
      operationId: checkVerification
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/2fa/setup:
    post:
      tags: [Auth]
      operationId: setupTwoFactor
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/auth/2fa/verify:
    post:
      tags: [Auth]
      operationId: verifyTwoFactorSetup
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/Totp' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/2fa/disable:
    post:
      tags: [Auth]
      operationId: disableTwoFactor
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TwoFactorCode' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/2fa/status:
    post:
      tags: [Auth]
      operationId: getTwoFactorStatus
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/2fa/loginVerifyLastStep:
    post:
      tags: [Auth]
      operationId: completeTwoFactorLogin
      requestBody: { $ref: '#/components/requestBodies/TwoFactorLogin' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/user:
    get:
      tags: [Users]
      operationId: getOwnProfile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      operationId: updateOwnProfile
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ProfileUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
    delete:
      tags: [Users]
      operationId: deleteOwnAccount
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/user/byId:
    post:
      tags: [Users]
      operationId: getPublicProfileById
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/UserId' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/user/fcm:
    post:
      tags: [Users]
      operationId: saveFcmToken
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/Fcm' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/user/location/history:
    get:
      tags: [Users]
      operationId: getUserLocationHistory
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/user/location/ping:
    post:
      tags: [Users]
      operationId: pingUserLocation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                city: { type: string, nullable: true }
                country_code: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/user/settings/search:
    put:
      tags: [Users]
      operationId: updateSearchSettings
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                search_radius_km: { type: integer, minimum: 10, maximum: 300 }
                search_scope:
                  type: string
                  enum: [radius, country, world, specific_country]
                search_target_country: { type: string, pattern: '^[A-Z]{2}$', nullable: true }
                search_match_live_location: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/user/photo/{position}:
    delete:
      tags: [Photos]
      operationId: deletePhotoByPosition
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PhotoPosition'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/user/photos:
    get:
      tags: [Photos]
      operationId: getUserPhotos
      security: [{ bearerAuth: [] }]
      parameters:
        - name: userId
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Photos]
      operationId: uploadUserPhoto
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/SinglePhoto' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
  /api/user/photos/{photoId}:
    delete:
      tags: [Photos]
      operationId: deletePhotoById
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/users:
    get:
      tags: [Users]
      operationId: listPublicProfiles
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/swipe/feed:
    get:
      tags: [Discovery]
      operationId: getDiscoveryFeed
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/swipe/like:
    post:
      tags: [Discovery]
      operationId: likeUser
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TargetUser' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/swipe/dislike:
    post:
      tags: [Discovery]
      operationId: dislikeUser
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/TargetUser' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/match:
    get:
      tags: [Matches]
      operationId: getMatches
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/match/unseen:
    get:
      tags: [Matches]
      operationId: getUnseenMatches
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/match/mark-seen:
    post:
      tags: [Matches]
      operationId: markMatchesSeen
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/MatchIds' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/chats:
    get:
      tags: [Chats]
      operationId: getChats
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/chats/{chatId}/messages:
    get:
      tags: [Chats]
      operationId: getChatMessages
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChatId'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/chats/{chatId}/members:
    get:
      tags: [Chats]
      operationId: getChatMembers
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChatId'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/chats/{chatId}/read:
    patch:
      tags: [Chats]
      operationId: markChatRead
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ChatId'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/chats/private:
    post:
      tags: [Chats]
      operationId: createPrivateChat
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/PrivateChat' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/chats/group:
    post:
      tags: [Chats]
      operationId: createGroupChat
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/GroupChat' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/chats/send:
    post:
      tags: [Chats]
      operationId: sendChatMessage
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ChatMessage' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/chats/history/{userId}:
    get:
      tags: [Chats]
      operationId: getPrivateChatHistory
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/catalog/animes:
    get:
      tags: [Catalog]
      operationId: listAnimes
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/catalog/games:
    get:
      tags: [Catalog]
      operationId: listGames
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /api/report:
    post:
      tags: [Moderation]
      operationId: reportUser
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/Report' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/feedback:
    post:
      tags: [Moderation]
      operationId: submitFeedback
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/Feedback' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Uuid: { type: string, format: uuid }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details: { type: array, items: { type: object } }
    Register:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 30, pattern: '^[a-zA-Z0-9_.]+$' }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
    Login:
      type: object
      required: [password]
      anyOf: [{ required: [email] }, { required: [username] }]
      properties:
        email: { type: string, format: email }
        username: { type: string, minLength: 3, maxLength: 30 }
        password: { type: string, minLength: 1, maxLength: 128 }
    ProfileUpdate:
      type: object
      properties:
        nickname: { type: string, maxLength: 30 }
        bio: { type: string, maxLength: 500 }
        gender: { type: string, enum: [male, female, non_binary, other, prefer_not_to_say, ''] }
        birthdate: { type: string }
        animes: { type: string, maxLength: 20000 }
        games: { type: string, maxLength: 20000 }
        reorderedPositions: { type: string, maxLength: 20000 }
        photo_0: { type: string, format: binary }
        photo_1: { type: string, format: binary }
        photo_2: { type: string, format: binary }
        photo_3: { type: string, format: binary }
  parameters:
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Offset: { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
    ChatId: { name: chatId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    UserId: { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PhotoId: { name: photoId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    PhotoPosition: { name: position, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 4 } }
  requestBodies:
    Register: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Register' } } } }
    Login: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Login' } } } }
    Email: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } } }
    PasswordReset: { required: true, content: { application/json: { schema: { type: object, required: [email, token, newPassword], properties: { email: { type: string, format: email }, token: { type: string, minLength: 6, maxLength: 64 }, newPassword: { type: string, minLength: 8, maxLength: 128 } } } } } }
    VerificationType: { required: true, content: { application/json: { schema: { type: object, required: [type], properties: { type: { type: string, enum: [email, sms] } } } } } }
    VerificationCode: { required: true, content: { application/json: { schema: { type: object, required: [type, token], properties: { type: { type: string, enum: [email, sms] }, token: { type: string, minLength: 6, maxLength: 64 } } } } } }
    Totp: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string, pattern: '^\d{6}$' } } } } } }
    TwoFactorCode: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, minLength: 6, maxLength: 64 } } } } } }
    TwoFactorLogin: { required: true, content: { application/json: { schema: { type: object, required: [challengeToken, code], properties: { challengeToken: { type: string, minLength: 20, maxLength: 4096 }, code: { type: string, minLength: 6, maxLength: 64 } } } } } }
    UserId: { required: true, content: { application/json: { schema: { type: object, required: [id], properties: { id: { $ref: '#/components/schemas/Uuid' } } } } } }
    Fcm: { required: true, content: { application/json: { schema: { type: object, required: [fcm], properties: { fcm: { type: string, minLength: 20, maxLength: 4096 }, platform: { type: string, enum: [android, ios, web], default: android } } } } } }
    ProfileUpdate: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/ProfileUpdate' } } } }
    SinglePhoto: { required: true, content: { multipart/form-data: { schema: { type: object, required: [photo], properties: { photo: { type: string, format: binary }, position: { type: integer, minimum: 1, maximum: 4 } } } } } }
    TargetUser: { required: true, content: { application/json: { schema: { type: object, required: [toUserId], properties: { toUserId: { $ref: '#/components/schemas/Uuid' } } } } } }
    MatchIds: { required: true, content: { application/json: { schema: { type: object, required: [matchIds], properties: { matchIds: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Uuid' } } } } } } }
    PrivateChat: { required: true, content: { application/json: { schema: { type: object, required: [otherUserId], properties: { otherUserId: { $ref: '#/components/schemas/Uuid' } } } } } }
    GroupChat: { required: true, content: { application/json: { schema: { type: object, required: [name, userIds], properties: { name: { type: string, minLength: 1, maxLength: 100 }, userIds: { type: array, minItems: 1, maxItems: 99, items: { $ref: '#/components/schemas/Uuid' } } } } } } }
    ChatMessage: { required: true, content: { application/json: { schema: { type: object, required: [toUserId, text], properties: { toUserId: { $ref: '#/components/schemas/Uuid' }, text: { type: string, minLength: 1, maxLength: 4000 } } } } } }
    Report: { required: true, content: { application/json: { schema: { type: object, required: [reportedUser, reason], properties: { reportedUser: { $ref: '#/components/schemas/Uuid' }, reason: { type: string, minLength: 5, maxLength: 2000 } } } } } }
